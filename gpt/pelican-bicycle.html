<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8eeec">
  <title>鹈鹕的海风骑行 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #d8eeec;
      color: #234958;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 42px);
      background: radial-gradient(circle at 50% 5%, #f8faf0 0, #d8eeec 62%, #b9dbd8 100%);
    }

    .poster {
      position: relative;
      width: min(100%, 1240px);
      overflow: hidden;
      border: 10px solid #fffaf0;
      border-radius: 30px;
      background: #d9f1ee;
      box-shadow: 0 24px 65px #28535b2c, 0 4px 14px #28535b16;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    button {
      position: absolute;
      right: clamp(14px, 3%, 34px);
      bottom: clamp(14px, 3%, 28px);
      display: flex;
      align-items: center;
      gap: .55em;
      min-height: 43px;
      padding: 9px 15px;
      border: 1.5px solid #234958;
      border-radius: 999px;
      background: #fffaf0ef;
      color: #234958;
      font-family: inherit;
      font-size: clamp(12px, 1.3vw, 15px);
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: 0 4px 0 #23495820;
    }

    button:hover { background: #ffffff; transform: translateY(-2px); }
    button:active { transform: translateY(1px); box-shadow: 0 1px 0 #23495820; }
    button:focus-visible { outline: 3px solid #e9765c; outline-offset: 4px; }

    .cloud-left { animation: cloud-left 11s ease-in-out infinite alternate; }
    .cloud-right { animation: cloud-right 14s ease-in-out infinite alternate; }
    .wave-one { animation: wave-drift 7s ease-in-out infinite alternate; }
    .wave-two { animation: wave-drift 9s ease-in-out infinite alternate-reverse; }
    .road-marks { animation: road-scroll 1.55s linear infinite; }
    .scarf-tail { transform-origin: 620px 278px; animation: scarf-flutter .75s ease-in-out infinite alternate; }
    .sun-rays { transform-origin: 1000px 143px; animation: sunshine 28s linear infinite; }

    .paused .moving { animation-play-state: paused !important; }

    @media (prefers-reduced-motion: reduce) {
      body:not(.motion-override) .moving { animation: none !important; }
      button { transition: none; }
    }

    @keyframes cloud-left { to { transform: translateX(33px); } }
    @keyframes cloud-right { to { transform: translateX(-41px); } }
    @keyframes wave-drift { to { transform: translateX(30px); } }
    @keyframes road-scroll { to { transform: translateX(-145px); } }
    @keyframes scarf-flutter { to { transform: rotate(-9deg); } }
    @keyframes sunshine { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .poster { border-width: 5px; border-radius: 17px; }
      button { min-height: 34px; padding: 6px 9px; border-width: 1px; font-size: 10px; }
    }
  </style>
</head>

  <script>
    (() => {
      const body = document.body;
      const button = document.getElementById('toggle-motion');
      const label = button.querySelector('span');
      const media = window.matchMedia('(prefers-reduced-motion: reduce)');
      const wheelRear = document.getElementById('rear-spokes');
      const wheelFront = document.getElementById('front-spokes');
      const upper = document.getElementById('pelican-upper');
      const wing = document.getElementById('flapping-wing');
      const crankFront = document.getElementById('crank-front');
      const crankBack = document.getElementById('crank-back');
      const cx = 565, cy = 532, crankRadius = 42;
      let playing = !media.matches;
      let elapsed = 0;
      let previous = performance.now();

      function pointOnCrank(angle) {
        return { x: cx + crankRadius * Math.cos(angle), y: cy + crankRadius * Math.sin(angle) };
      }

      function drawLeg(name, hipX, hipY, foot, isFront) {
        const dx = foot.x - hipX;
        const dy = foot.y - hipY;
        const distance = Math.hypot(dx, dy);
        const thigh = isFront ? 122 : 120;
        const shin = isFront ? 128 : 127;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const aside = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + (dx / distance) * along + (dy / distance) * aside;
        const kneeY = hipY + (dy / distance) * along - (dx / distance) * aside;
        document.getElementById(name + '-leg').setAttribute('d',
          `M${hipX.toFixed(1)} ${hipY.toFixed(1)} L${kneeX.toFixed(1)} ${kneeY.toFixed(1)} L${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
        const knee = document.getElementById(name + '-knee');
        knee.setAttribute('cx', kneeX.toFixed(1));
        knee.setAttribute('cy', kneeY.toFixed(1));
        document.getElementById(name + '-foot').setAttribute('transform',
          `translate(${foot.x.toFixed(1)} ${foot.y.toFixed(1)})`);
      }

      function render(seconds) {
        const turns = seconds / 1.55;
        const angle = turns * Math.PI * 2 - Math.PI / 3;
        const front = pointOnCrank(angle);
        const back = pointOnCrank(angle + Math.PI);
        const bob = Math.sin(angle * 2) * 3.5;
        const wheelAngle = turns * 360;

        wheelRear.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
        wheelFront.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
        upper.setAttribute('transform', `translate(0 ${bob.toFixed(1)})`);
        wing.setAttribute('transform', `rotate(${(Math.sin(angle) * 4).toFixed(1)} 485 306)`);
        crankFront.setAttribute('d', `M${cx} ${cy} L${front.x.toFixed(1)} ${front.y.toFixed(1)}`);
        crankBack.setAttribute('d', `M${cx} ${cy} L${back.x.toFixed(1)} ${back.y.toFixed(1)}`);
        drawLeg('front', 515, 353 + bob, front, true);
        drawLeg('back', 548, 357 + bob, back, false);
      }

      function updateButton() {
        body.classList.toggle('paused', !playing);
        button.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        button.firstChild.textContent = playing ? '❚❚ ' : '▶ ';
        label.textContent = playing ? '暂停动画' : '播放动画';
      }

      button.addEventListener('click', () => {
        playing = !playing;
        if (playing) body.classList.add('motion-override');
        updateButton();
      });

      media.addEventListener('change', event => {
        if (event.matches) {
          playing = false;
          body.classList.remove('motion-override');
        }
        updateButton();
      });

      function tick(now) {
        const delta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        if (playing) {
          elapsed += delta;
          render(elapsed);
        }
        requestAnimationFrame(tick);
      }

      render(0);
      updateButton();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
